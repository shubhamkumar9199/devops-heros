name: Session 16 CI and Session 21 Tests
on:
  push:
    branches: [main]
    paths: [".github/workflows/homework-ci.yml", "session-16-github-actions/demo/**", "session21-python/taskboard/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'session-16-github-actions/demo'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: 'session-16-github-actions/demo/build'
  taskboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'session21-python/taskboard/backend'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -v
