# Local cluster: 1 control plane + 2 workers.
#   kind create cluster --config k8s/kind-cluster.yaml
# Ports 80/443 of the control-plane node are published on 127.0.0.1 only, and
# Traefik binds them with hostPorts (k8s/traefik-values.yaml), so
# http://shelfwise.local reaches the Ingress once the name points at 127.0.0.1.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shelfwise
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
  - role: worker
