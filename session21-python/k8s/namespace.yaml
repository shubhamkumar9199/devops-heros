# The application namespace (Argo CD deploys the Helm chart here).
# Pod Security "restricted": the API server rejects any pod that could run as
# root, escalate privileges, keep Linux capabilities or skip seccomp.
apiVersion: v1
kind: Namespace
metadata:
  name: shelfwise
  labels:
    app.kubernetes.io/part-of: shelfwise
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
