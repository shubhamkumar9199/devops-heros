# helm test: the API answers through its Service and reports the deployed build.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "shelfwise.fullname" . }}-test-api
  labels:
    {{- include "shelfwise.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- include "shelfwise.podSecurity" (dict "uid" 10001) | nindent 4 }}
  containers:
    - name: check
      image: {{ include "shelfwise.backendImage" . }}
      command:
        - python
        - -c
        - |
          import json, sys, urllib.request
          base = "http://{{ include "shelfwise.fullname" . }}-backend:8000"
          info = json.load(urllib.request.urlopen(base + "/api/info", timeout=5))
          ready = urllib.request.urlopen(base + "/ready", timeout=5).status
          print("version", info["version"], "pod", info["pod"], "ready", ready)
          sys.exit(0 if info["version"] == {{ .Values.backend.image.tag | trunc 12 | quote }} and ready == 200 else 1)
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 96Mi }
      securityContext:
        {{- include "shelfwise.containerSecurity" . | nindent 8 }}
