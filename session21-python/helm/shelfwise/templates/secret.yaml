{{- if not .Values.database.existingSecret }}
{{- /* Rendered only when no existing Secret is named, from an explicit value. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shelfwise.dbSecretName" . }}
  labels:
    {{- include "shelfwise.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ required "set database.password, or database.existingSecret to a Secret you created" .Values.database.password | quote }}
{{- end }}
