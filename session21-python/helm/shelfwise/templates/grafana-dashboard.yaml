{{- if and .Values.monitoring.enabled .Values.monitoring.dashboard }}
# Grafana's sidecar (kube-prometheus-stack) loads every ConfigMap labelled
# grafana_dashboard=1, in any namespace (see monitoring/kube-prometheus-stack-values.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shelfwise.fullname" . }}-dashboard
  labels:
    {{- include "shelfwise.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: ShelfWise
data:
  shelfwise.json: |-
{{ .Files.Get "dashboards/shelfwise.json" | indent 4 }}
{{- end }}
