apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shelfwise.fullname" . }}-config
  labels:
    {{- include "shelfwise.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "shelfwise.fullname" . }}-postgres
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  LIBRARY_TIMEZONE: {{ .Values.library.timezone | quote }}
