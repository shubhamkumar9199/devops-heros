# Lab 2: pods are Running and Ready, but the Service sends traffic nowhere.
# Symptom: requests to the Service hang or are refused; it has no endpoints.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-web
  namespace: shelfwise-labs
spec:
  replicas: 2
  selector:
    matchLabels: { app: lab-web }
  template:
    metadata:
      labels: { app: lab-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.31.7-alpine3.24
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: lab-web
  namespace: shelfwise-labs
spec:
  selector:
    app: lab-wbe  # BUG: typo, matches no pod
  ports:
    - port: 80
      targetPort: http
