# Lab 4: the container is never created. Symptom: CreateContainerConfigError.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-secret
  namespace: shelfwise-labs
spec:
  replicas: 1
  selector:
    matchLabels: { app: lab-secret }
  template:
    metadata:
      labels: { app: lab-secret }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.31.7-alpine3.24
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-db  # BUG: this Secret was never created
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
