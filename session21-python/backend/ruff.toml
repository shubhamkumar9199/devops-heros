line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the documented pattern

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and dummy passwords are fine in tests
"alembic/**" = ["E501"]

[lint.isort]
known-third-party = ["alembic"]  # not the local alembic/ migrations folder
