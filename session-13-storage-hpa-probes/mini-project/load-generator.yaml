apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: production-webapp
spec:
  activeDeadlineSeconds: 180
  restartPolicy: Never
  containers:
    - name: requests
      image: busybox:1.36
      command: ["sh", "-c", "while true; do wget -q -O /dev/null http://web-service; done"]
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 100m, memory: 32Mi}
